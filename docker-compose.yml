services:
  postgres:
    image: postgres:16-alpine
    container_name: comic-postgres
    environment:
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: comic123
      POSTGRES_DB: comic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comic-redis
    ports:
      # 宿主 6380 -> 容器 6379（与 server/.env.example 的 REDIS_PORT=6380 对齐）
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: comic-api
    ports:
      # 宿主 8088 -> 容器 8080（前端 vite 代理写死 127.0.0.1:8088；宿主 8080 常被其他服务占用）
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: comic
      DB_PASSWORD: comic123
      DB_NAME: comic
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8080"
      ALLCPP_BASE_URL: https://www.allcpp.cn

volumes:
  pgdata:
