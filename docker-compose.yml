version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: comic-postgres
    environment:
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: comic123
      POSTGRES_DB: comic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: comic-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: comic
      DB_PASSWORD: comic123
      DB_NAME: comic
      SERVER_PORT: "8080"
      ALLCPP_BASE_URL: https://www.allcpp.cn

volumes:
  pgdata:
